# Cloudflare Workers configuration for Hutchrok Solutions Group.
# Used by @opennextjs/cloudflare to configure the Workers runtime.

name = "hutchrok-solutions"
account_id = "62738e2bb751720449f1cd904f6d175f"
compatibility_date = "2026-08-23"
compatibility_flags = ["nodejs_compat"]

# The OpenNext adapter outputs to worker.js — this is the main entrypoint.
main = ".open-next/worker.js"

routes = [
  { pattern = "hutchrok.com", custom_domain = true },
  { pattern = "www.hutchrok.com", custom_domain = true },
]

# Static assets (including public/filings/*.pdf) are served from
# .open-next/assets, and exposed to the Worker via the ASSETS binding.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Agent tracing (see lib/agents/tracing.ts) — 5% sampling, metadata only
# (no message/tool payloads are recorded).
[observability.traces]
enabled = true
head_sampling_rate = 0.05
